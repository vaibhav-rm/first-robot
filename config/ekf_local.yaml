ekf_local_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    # Was 0.1s, but the lidar publishes every ~156ms. robot_localization treats
    # a sensor as stale once its queue exceeds sensor_timeout, so the IMU was
    # being intermittently dropped and the filter leaned entirely on wheel odom.
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: wheel/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # Heading only. In two_d_mode the roll/pitch/linear-accel terms this
    # previously fused were discarded anyway, but only after being mixed into
    # the filter state, where the ramp and the 6Hz lidar both excited them.
    # yaw and wz are what actually help a diff-drive pose estimate.
    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
