slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_region_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # None lets a single bad scan (robot brushed a wall, or one dropout at the
    # 6Hz lidar rate) dominate the graph optimisation and drag the whole map
    # off. Huber bounds that influence so outliers are down-weighted.
    ceres_loss_function: HuberLoss

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: scan
    mode: mapping

    # if you'd like to dynamically set a map
    # map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: true

    # Settings
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    # Shorter than the sensor's 10m range on purpose: rays that long carve
    # free space far past the arena walls and inflate the occupancy grid.
    max_laser_range: 6.0
    # Was 0.5s. The lidar publishes at ~6.4Hz (156ms) on this hardware, so a
    # 0.5s floor discarded roughly two scans out of every three - the map was
    # built from a sparse, badly-connected scan chain.
    minimum_time_interval: 0.0
    # Was 0.2s, which is only 44ms of slack over the 156ms scan period.
    # Exceeding it makes SLAM Toolbox drop the scan and wait, so each missed
    # lookup pushed the map further out of step with odometry.
    transform_timeout: 0.5
    tf_buffer_duration: 30.

    # General Parameters
    use_scan_matching: true
    # Barycenter weights every scan ray equally, so the long open-ground rays
    # that dominate this arena outvote the short wall returns and the estimate
    # drifts. Without it SLAM Toolbox weights by range, which is what locks
    # onto the walls here.
    use_scan_barycenter: false
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1  
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true 
    loop_match_minimum_chain_size: 10           
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.35    
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1 

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5      
    angle_variance_penalty: 1.0    

    fine_search_angle_offset: 0.00349     
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
